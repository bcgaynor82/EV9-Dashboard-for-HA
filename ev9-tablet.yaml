              - input_boolean.ev9_departure_enabled
              - input_datetime.ev9_ready_by
              - input_boolean.ev9_departure_weekdays
              - input_number.ev9_departure_lead
              - input_number.ev9_departure_temp
            show_name: false
            show_icon: false
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Departure Planner
                  size: normal
                  dismissable: true
                  content:
                    type: vertical-stack
                    cards:
                      - type: markdown
                        content: Set when the car should be ready. Climate starts **lead minutes** before departure. If plugged into NACS, charging is timed to hit the limit by departure.
                      - type: entities
                        title: Departure Settings
                        entities:
                          - input_boolean.ev9_departure_enabled
                          - input_datetime.ev9_ready_by
                          - input_boolean.ev9_departure_weekdays
                          - input_number.ev9_departure_temp
                          - input_number.ev9_departure_lead
                          - input_number.ev9_departure_buffer
            styles:
              card:
                - background: "[[[ return states['input_boolean.ev9_departure_enabled']?.state === 'on' ? 'linear-gradient(135deg, rgba(34, 197, 94, 0.18) 0%, rgba(10, 20, 25, 0.95) 100%)' : 'rgba(255, 255, 255, 0.035)'; ]]]"
                - border-radius: 18px
                - border: "[[[ return states['input_boolean.ev9_departure_enabled']?.state === 'on' ? '1px solid rgba(34, 197, 94, 0.45)' : '1px solid rgba(255, 255, 255, 0.07)'; ]]]"
                - padding: 11px 14px
              grid:
                - grid-template-areas: '"c"'
                - grid-template-columns: 1fr
              custom_fields:
                c:
                  - width: 100%
            custom_fields:
              c: |
                [[[
                  const on = states['input_boolean.ev9_departure_enabled']?.state === 'on';
                  const t = states['input_datetime.ev9_ready_by']?.state;
                  let tt = '07:30';
                  if (t && t.includes(':')) {
                    const [h, m] = t.split(':').map(Number);
                    const d = new Date(); d.setHours(h, m, 0, 0);
                    tt = d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
                  }
                  const lead = Math.round(Number(states['input_number.ev9_departure_lead']?.state || 15));
                  const temp = Math.round(Number(states['input_number.ev9_departure_temp']?.state || 72)) + '°F';
                  return `
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
                      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                        <ha-icon icon="mdi:clock-check-outline" style="--mdc-icon-size:20px;color:${on ? '#22c55e' : '#c084fc'};flex-shrink:0;"></ha-icon>
                        <div style="min-width:0;">
                          <div style="font-size:13.5px;font-weight:800;color:#ffffff;">${on ? 'Ready by ' + tt : 'Smart Departure Scheduler'}</div>
                          <div style="font-size:10px;font-weight:600;color:${on ? '#22c55e' : '#94a3b8'};margin-top:1px;">${on ? 'Preconditioning ' + lead + 'm prior · ' + temp : 'Off · Tap to schedule ready-by time'}</div>
                        </div>
                      </div>
                      <div style="font-size:10px;font-weight:800;color:${on ? '#22c55e' : '#94a3b8'};background:${on ? 'rgba(34,197,94,0.15)' : 'rgba(255,255,255,0.06)'};border:1px solid ${on ? 'rgba(34,197,94,0.3)' : 'transparent'};padding:3.5px 9px;border-radius:999px;flex-shrink:0;">${on ? 'ACTIVE' : 'IDLE'}</div>
                    </div>`;
                ]]]
