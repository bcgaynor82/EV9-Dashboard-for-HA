                  const n = e => Number(S(e)?.state);
                  const chg = S('binary_sensor.ev9_ev_battery_charge')?.state === 'on';
                  const eff = n('sensor.ev9_efficiency');
                  const kwh = n('sensor.ev9_session_kwh');
                  const cost = n('sensor.ev9_session_cost');
                  const gain = n('sensor.ev9_session_range_added');
                  const money = v => isFinite(v) ? '$' + v.toFixed(2) : '$0.00';
                  const effVal = isFinite(eff) && eff > 0 ? eff.toFixed(1) : '3.1';
                  const effPct = Math.min(100, Math.max(15, (Number(effVal) / 5.0) * 100));
                  const cell = (cap, val, unit, pct, barCol) => `
                    <div style="min-width:0;padding:1px;">
                      <div style="font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#78889b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cap}</div>
