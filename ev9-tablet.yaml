                        <span style="font-size:9px;font-weight:600;color:#94a3b8;white-space:nowrap;">${chg ? 'REAL-TIME DATA' : 'COMPLETED'}</span>
                      </div>
                      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">
                        ${cell('EFFICIENCY', effVal, 'mi/kWh', effPct, '#38bdf8')}
                        ${cell('ENERGY', isFinite(kwh) ? kwh.toFixed(1) : '0.0', 'kWh', Math.min(100, Math.max(10, ((kwh || 0) / 80) * 100)), '#22c55e')}
                        ${cell('EST. COST', money(cost), 'USD', Math.min(100, Math.max(10, ((cost || 0) / 25) * 100)), '#fbbf24')}
                        ${cell('ADDED', isFinite(gain) ? '+' + Math.round(gain) : '+0', 'mi', Math.min(100, Math.max(10, ((gain || 0) / 250) * 100)), '#c084fc')}
                      </div>
