type: vertical-stack
cards:
  # =========================================================================
  # 1A. TOP BAR (MATCHED HEIGHT AUTO-TRUNCATING CITY/STATE PILL + REFRESH)
  # =========================================================================
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: device_tracker.ev9_location
        triggers_update:
          - device_tracker.ev9_location
        show_name: false
        show_icon: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: EV9 Location
              size: normal
              dismissable: true
              content:
                type: map
                entities:
                  - device_tracker.ev9_location
                default_zoom: 15
        styles:
          card:
            - background: rgba(16, 25, 38, 0.92)
            - border: 1px solid rgba(255, 255, 255, 0.09)
            - border-radius: 18px 0 0 0
            - border-right: none
            - border-bottom: none
            - padding: 10px 16px
            - min-height: 52px
            - height: 100%
            - box-sizing: border-box
            - cursor: pointer
            - display: flex
            - align-items: center
          grid:
            - grid-template-areas: '"z"'
            - grid-template-columns: 1fr
            - width: 100%
          custom_fields:
            z:
              - width: 100%
              - display: flex
              - align-items: center
        custom_fields:
          z: |
            [[[
              const locEntity = states['device_tracker.ev9_location'];
              const rawLoc = (locEntity?.state || '').trim();
              const locLower = rawLoc.toLowerCase();
              const attr = locEntity?.attributes || {};
              let zoneLabel = 'Away';
              let zoneColor = '#94a3b8';
              let zoneBg = 'rgba(148, 163, 184, 0.12)';
              let zoneBorder = 'rgba(148, 163, 184, 0.28)';

              if (rawLoc && !['not_home', 'away', 'unknown', 'unavailable', 'none', ''].includes(locLower)) {
                zoneLabel = rawLoc.replace(/\b\w/g, ch => ch.toUpperCase());
                if (locLower === 'home') {
                  zoneLabel = 'Home';
                  zoneColor = '#38bdf8';
                  zoneBg = 'rgba(56, 189, 248, 0.14)';
                  zoneBorder = 'rgba(56, 189, 248, 0.4)';
                } else if (['work', 'office'].includes(locLower)) {
                  zoneColor = '#c084fc';
                  zoneBg = 'rgba(192, 132, 252, 0.14)';
                  zoneBorder = 'rgba(192, 132, 252, 0.4)';
                } else {
                  zoneColor = '#fbbf24';
                  zoneBg = 'rgba(251, 191, 36, 0.14)';
                  zoneBorder = 'rgba(251, 191, 36, 0.4)';
                }
              } else {
                const city = (attr.city || attr.locality || attr.town || attr.suburb || '').trim();
                const state = (attr.state || attr.region || attr.state_code || '').trim();
                if (city && state) {
                  zoneLabel = `${city}, ${state}`;
                } else if (city) {
                  zoneLabel = city;
                } else if (attr.address) {
                  zoneLabel = String(attr.address).split(',')[0].trim();
                } else {
                  zoneLabel = 'Away';
                }
              }

              return `
                <div style="display:flex;flex-direction:row;align-items:center;gap:10px;width:100%;min-width:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
                  <span style="font-size:18px;font-weight:900;letter-spacing:0.06em;color:#ffffff;line-height:1.1;white-space:nowrap;flex-shrink:0;">KIA EV9</span>
                  <div style="display:inline-flex;align-items:center;gap:5px;background:${zoneBg};border:1px solid ${zoneBorder};color:${zoneColor};font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;line-height:1.2;white-space:nowrap;min-width:0;max-width:185px;overflow:hidden;text-overflow:ellipsis;">
                    <ha-icon icon="mdi:map-marker" style="--mdc-icon-size:14px;color:${zoneColor};display:flex;flex-shrink:0;"></ha-icon>
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${zoneLabel}</span>
                  </div>
                </div>`;
            ]]]
      - type: custom:button-card
        entity: button.ev9_force_refresh
        triggers_update:
          - sensor.ev9_last_updated_at
          - binary_sensor.ev9_ev_battery_charge
          - binary_sensor.ev9_ev_battery_plug
          - sensor.ev9_ev_charging_power
          - switch.ev9_climate
          - climate.ev9_climate_control
          - sensor.ev9_car_battery_level
        show_name: false
        show_icon: false
        tap_action:
          action: call-service
          service: script.ev9_safe_action
          data:
            target_action: button.press
            target_entity: button.ev9_force_refresh
        styles:
          card:
            - background: rgba(16, 25, 38, 0.92)
            - border: 1px solid rgba(255, 255, 255, 0.09)
            - border-radius: 0 18px 0 0
            - border-left: none
            - border-bottom: none
            - padding: 10px 16px
            - min-height: 52px
            - height: 100%
            - box-sizing: border-box
            - cursor: pointer
            - display: flex
            - align-items: center
          grid:
            - grid-template-areas: '"r"'
            - grid-template-columns: 1fr
            - width: 100%
          custom_fields:
            r:
              - width: 100%
              - display: flex
              - align-items: center
              - justify-content: flex-end
        custom_fields:
          r: |
            [[[
              const S = e => states[e]?.state;
              const num = e => Number(S(e));

              const syncRaw = S('sensor.ev9_last_updated_at');
              let syncAge = 'live';
              let syncMins = 0;
              if (syncRaw && !['unavailable', 'unknown', ''].includes(syncRaw.toLowerCase())) {
                const d = new Date(syncRaw);
                if (!isNaN(d.getTime())) {
                  syncMins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
                  syncAge = syncMins < 1 ? 'just now' : syncMins < 60 ? `${syncMins}m ago` : syncMins < 1440 ? `${Math.floor(syncMins / 60)}h ago` : `${Math.floor(syncMins / 1440)}d ago`;
                }
              }
              const ageColor = syncMins >= 30 ? '#fbbf24' : '#94a3b8';
              const aux = isFinite(num('sensor.ev9_car_battery_level')) ? Math.round(num('sensor.ev9_car_battery_level')) : 86;

              const rightPills = [];
              if (aux < 65) {
                rightPills.push(`<div style="font-size:11px;font-weight:800;color:#fbbf24;background:rgba(251,191,36,0.16);border:1px solid rgba(251,191,36,0.45);padding:4px 11px;border-radius:999px;white-space:nowrap;">12V ${aux}%</div>`);
              }

              return `
                <div style="display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;justify-content:flex-end;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
                  ${rightPills.join('')}
                  <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(192,132,252,0.14);border:1px solid rgba(192,132,252,0.35);padding:4px 12px;border-radius:999px;">
                    <span style="font-size:11.5px;font-weight:800;color:${ageColor};white-space:nowrap;">Synced ${syncAge}</span>
                    <ha-icon icon="mdi:cloud-sync-outline" style="--mdc-icon-size:14px;color:#c084fc;display:flex;"></ha-icon>
                  </div>
                </div>`;
            ]]]

  # =========================================================================
  # 2. TABLET WIDESCREEN 2-COLUMN COCKPIT GRID
  # =========================================================================
  - type: grid
    columns: 2
    square: false
    cards:
      # -----------------------------------------------------------------------
      # LEFT COLUMN: ENLARGED MIRRORED HERO STAGE, QUICK ACTIONS & CLIMATE
      # -----------------------------------------------------------------------
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.ev9_ev_battery_level
            triggers_update:
              - sensor.ev9_ev_battery_level
              - sensor.ev9_ev_range
              - binary_sensor.ev9_ev_battery_charge
              - binary_sensor.ev9_ev_battery_plug
              - sensor.ev9_ev_charging_power
              - sensor.ev9_car_battery_level
              - number.ev9_ac_charging_limit
              - number.ev9_dc_charging_limit
              - lock.ev9_door_lock
              - switch.ev9_climate
              - climate.ev9_climate_control
              - sensor.ev9_odometer
              - sensor.ev9_last_updated_at
              - binary_sensor.ev9_front_left_door
              - binary_sensor.ev9_front_right_door
              - binary_sensor.ev9_back_left_door
              - binary_sensor.ev9_back_right_door
              - binary_sensor.ev9_hood
              - binary_sensor.ev9_trunk
              - binary_sensor.ev9_sunroof
              - binary_sensor.ev9_tire_pressure_all
            show_name: false
            show_icon: false
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: EV9 Diagnostics & Health
                  size: normal
                  dismissable: true
                  content:
                    type: vertical-stack
                    cards:
                      - type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: custom:button-card
                            entity: lock.ev9_door_lock
                            name: Lock Doors
                            icon: mdi:lock
                            tap_action:
                              action: call-service
                              service: script.ev9_safe_action
                              data:
                                target_action: lock.lock
                                target_entity: lock.ev9_door_lock
                            styles:
                              card:
                                - background: >-
                                    linear-gradient(155deg, rgba(16, 185, 129,
                                    0.18) 0%, rgba(10, 15, 23, 0.96) 100%)
                                - border: >-
                                    [[[ return entity.state === 'locked' ? '1px
                                    solid rgba(52, 211, 153, 0.8)' : '1px solid
                                    rgba(255, 255, 255, 0.08)'; ]]]
                                - border-radius: 16px
                                - padding: 11px 10px
                                - box-sizing: border-box
                              icon:
                                - color: >-
                                    [[[ return entity.state === 'locked' ?
                                    '#34d399' : '#94a3b8'; ]]]
                                - width: 22px
                              name:
                                - font-size: 12px
                                - font-weight: 800
                                - color: '#ffffff'
                                - margin-top: 4px
                          - type: custom:button-card
                            entity: lock.ev9_door_lock
                            name: Unlock Doors
                            icon: mdi:lock-open-variant
                            tap_action:
                              action: call-service
                              service: script.ev9_safe_action
                              data:
                                target_action: lock.unlock
                                target_entity: lock.ev9_door_lock
                              confirmation:
                                text: Unlock all EV9 doors?
                            styles:
                              card:
                                - background: >-
                                    linear-gradient(155deg, rgba(245, 158, 11,
                                    0.18) 0%, rgba(12, 14, 19, 0.96) 100%)
                                - border: >-
                                    [[[ return entity.state !== 'locked' ? '1px
                                    solid rgba(251, 191, 36, 0.85)' : '1px solid
                                    rgba(255, 255, 255, 0.08)'; ]]]
                                - border-radius: 16px
                                - padding: 11px 10px
                                - box-sizing: border-box
                              icon:
                                - color: >-
                                    [[[ return entity.state !== 'locked' ?
                                    '#fbbf24' : '#94a3b8'; ]]]
                                - width: 22px
                              name:
                                - font-size: 12px
                                - font-weight: 800
                                - color: '#ffffff'
                                - margin-top: 4px
                      - type: custom:button-card
                        entity: sensor.ev9_ev_battery_level
                        triggers_update:
                          - sensor.ev9_ev_range
                          - binary_sensor.ev9_ev_battery_charge
                          - sensor.ev9_ev_charging_power
                          - number.ev9_ac_charging_limit
                          - number.ev9_dc_charging_limit
                        show_name: false
                        show_icon: false
                        tap_action:
                          action: none
                        styles:
                          card:
                            - background: linear-gradient(160deg, #111c2b 0%, #070b11 100%)
                            - border: 1px solid rgba(255, 255, 255, 0.08)
                            - border-radius: 18px
                            - padding: 14px 18px
                            - box-sizing: border-box
                            - overflow: hidden
                          grid:
                            - grid-template-areas: '"c"'
                            - grid-template-columns: 1fr
                          custom_fields:
                            c:
                              - width: 100%
                              - box-sizing: border-box
                        custom_fields:
                          c: |
                            [[[
                              const S = e => states[e]?.state;
                              const num = e => Number(S(e));
                              const on = e => S(e) === 'on';
                              const soc = isFinite(num('sensor.ev9_ev_battery_level')) ? Math.min(100, Math.max(1, Math.round(num('sensor.ev9_ev_battery_level')))) : 33;
                              const rng = isFinite(num('sensor.ev9_ev_range')) ? Math.max(0, Math.round(num('sensor.ev9_ev_range'))) : 106;
                              const chg = on('binary_sensor.ev9_ev_battery_charge');
                              const kw = num('sensor.ev9_ev_charging_power');
                              const dc = chg && kw > 25;
                              const lim = Math.min(100, Math.max(10, num(dc ? 'number.ev9_dc_charging_limit' : 'number.ev9_ac_charging_limit') || 80));
                              const fullMi = Math.max(rng, Math.round(rng * (100 / soc)));
                              const capMi = Math.round(fullMi * (lim / 100));
                              return `
                                <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;width:100%;padding:0 8px;">
                                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
                                    <span style="font-size:10px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#38bdf8;">RANGE &amp; LIMIT PROJECTIONS</span>
                                    <span style="font-size:9.5px;font-weight:800;color:#22c55e;white-space:nowrap;">CAP ${lim}%</span>
                                  </div>
                                  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
                                    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 12px;box-sizing:border-box;min-width:0;">
                                      <div style="font-size:8.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;">TARGET (${lim}%)</div>
                                      <div style="font-size:17px;font-weight:900;color:#22c55e;margin-top:3px;">${capMi} <span style="font-size:11px;font-weight:600;color:#94a3b8;">mi</span></div>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 12px;box-sizing:border-box;min-width:0;">
                                      <div style="font-size:8.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;">FULL CAPACITY</div>
                                      <div style="font-size:17px;font-weight:900;color:#ffffff;margin-top:3px;">${fullMi} <span style="font-size:11px;font-weight:600;color:#94a3b8;">mi</span></div>
                                    </div>
                                  </div>
                                </div>`;
                            ]]]
                      - type: custom:button-card
                        entity: sensor.ev9_ev_battery_level
                        triggers_update:
                          - sensor.ev9_odometer
                          - sensor.ev9_car_battery_level
                          - sensor.ev9_ev_state_of_health_battery
                          - sensor.ev9_next_service
                          - sensor.ev9_dtc_count
                          - sensor.ev9_last_updated_at
                        show_name: false
                        show_icon: false
                        tap_action:
                          action: none
                        styles:
                          card:
                            - background: linear-gradient(160deg, #111c2b 0%, #070b11 100%)
                            - border: 1px solid rgba(255, 255, 255, 0.08)
                            - border-radius: 18px
                            - padding: 14px 18px
                            - box-sizing: border-box
                            - overflow: hidden
                          grid:
                            - grid-template-areas: '"c"'
                            - grid-template-columns: 1fr
                          custom_fields:
                            c:
                              - width: 100%
                              - box-sizing: border-box
                        custom_fields:
                          c: |
                            [[[
                              const S = e => states[e];
                              const ok = e => S(e) && !['unavailable', 'unknown', ''].includes(S(e).state);
                              const n = e => Number(S(e)?.state);
                              const ago = s => {
                                const d = new Date(s);
                                if (isNaN(d)) return s && s !== 'unknown' ? s : '—';
                                const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
                                return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago';
                              };
                              const tile = (cap, val, sub, accent, warn) => `
                                <div style="background:rgba(255,255,255,0.03);border:1px solid ${warn ? 'rgba(244,63,94,0.45)' : 'rgba(255,255,255,0.06)'};border-radius:12px;padding:9px 6px;box-sizing:border-box;min-width:0;text-align:center;">
                                  <div style="font-size:8px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#78889b;">${cap}</div>
                                  <div style="font-size:14.5px;font-weight:900;color:${warn ? '#f43f5e' : accent};margin-top:3px;line-height:1.15;">${val}</div>
                                  <div style="font-size:8.5px;font-weight:600;color:#94a3b8;margin-top:2px;">${sub}</div>
                                </div>`;
                              const dtc = n('sensor.ev9_dtc_count');
                              const odo = ok('sensor.ev9_odometer') ? Math.round(n('sensor.ev9_odometer')).toLocaleString() : '3,076';
                              const aux = ok('sensor.ev9_car_battery_level') ? Math.round(n('sensor.ev9_car_battery_level')) : 86;
                              const soh = ok('sensor.ev9_ev_state_of_health_battery') ? Math.round(n('sensor.ev9_ev_state_of_health_battery')) : 100;
                              const svc = ok('sensor.ev9_next_service') ? (isFinite(n('sensor.ev9_next_service')) ? Math.round(n('sensor.ev9_next_service')).toLocaleString() + ' mi' : S('sensor.ev9_next_service').state) : '12,924 mi';
                              const sync = ok('sensor.ev9_last_updated_at') ? ago(S('sensor.ev9_last_updated_at').state) : 'Just now';
                              return `
                                <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;width:100%;padding:0 8px;">
                                  <div style="font-size:10px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#38bdf8;margin-bottom:10px;">VEHICLE VITALS</div>
                                  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
                                    ${tile('ODOMETER', odo + ' mi', 'Cumulative', '#ffffff', false)}
                                    ${tile('12V AUX', aux + '%', aux < 65 ? 'Check' : 'Nominal', aux < 65 ? '#fbbf24' : '#22c55e', aux < 55)}
                                    ${tile('PACK SOH', soh + '%', 'Battery Health', '#38bdf8', false)}
                                    ${tile('SERVICE', svc, 'Upcoming', '#ffffff', false)}
                                    ${tile('DTC CODES', isFinite(dtc) ? dtc : '0', dtc > 0 ? 'Active Fault' : 'Clear', dtc > 0 ? '#f43f5e' : '#22c55e', dtc > 0)}
                                    ${tile('SYNC', sync, 'Telemetry', '#c084fc', false)}
                                  </div>
                                </div>`;
                            }]]]
                      - type: custom:button-card
                        entity: lock.ev9_door_lock
                        triggers_update:
                          - binary_sensor.ev9_front_left_door
                          - binary_sensor.ev9_front_right_door
                          - binary_sensor.ev9_back_left_door
                          - binary_sensor.ev9_back_right_door
                          - binary_sensor.ev9_hood
                          - binary_sensor.ev9_trunk
                          - binary_sensor.ev9_sunroof
                          - binary_sensor.ev9_tire_pressure_all
                        show_name: false
                        show_icon: false
                        tap_action:
                          action: none
                        styles:
                          card:
                            - background: linear-gradient(160deg, #111c2b 0%, #070b11 100%)
                            - border: 1px solid rgba(255, 255, 255, 0.08)
                            - border-radius: 18px
                            - padding: 14px 18px
                            - box-sizing: border-box
                            - overflow: hidden
                          grid:
                            - grid-template-areas: '"c"'
                            - grid-template-columns: 1fr
                          custom_fields:
                            c:
                              - width: 100%
                              - box-sizing: border-box
                        custom_fields:
                          c: |
                            [[[
                              const on = e => states[e]?.state === 'on';
                              const items = [
                                ['Front Left Door', on('binary_sensor.ev9_front_left_door'), 'mdi:car-door'],
                                ['Front Right Door', on('binary_sensor.ev9_front_right_door'), 'mdi:car-door'],
                                ['Rear Left Door', on('binary_sensor.ev9_back_left_door'), 'mdi:car-door'],
                                ['Rear Right Door', on('binary_sensor.ev9_back_right_door'), 'mdi:car-door'],
                                ['Frunk Hood', on('binary_sensor.ev9_hood'), 'mdi:car'],
                                ['Trunk Tailgate', on('binary_sensor.ev9_trunk'), 'mdi:car'],
                                ['Glass Sunroof', on('binary_sensor.ev9_sunroof'), 'mdi:window-closed-variant']
                              ];
                              const row = (label, open, icon, last) => `
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${last ? '' : 'border-bottom:1px solid rgba(255,255,255,0.06);'}font-size:12px;box-sizing:border-box;width:100%;">
                                  <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                                    <ha-icon icon="${icon}" style="--mdc-icon-size:16px;color:${open ? '#f43f5e' : '#94a3b8'};flex-shrink:0;"></ha-icon>
                                    <span style="color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
                                  </div>
                                  <span style="font-size:9.5px;font-weight:800;color:${open ? '#f43f5e' : '#22c55e'};background:${open ? 'rgba(244,63,94,0.16)' : 'rgba(34,197,94,0.12)'};padding:2px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-right:4px;">${open ? 'OPEN' : 'SECURED'}</span>
                                </div>`;
                              const tyre = on('binary_sensor.ev9_tire_pressure_all');
                              return `
                                <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;width:100%;padding:0 8px;">
                                  <div style="font-size:10px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#38bdf8;margin-bottom:6px;">PERIMETER &amp; TPMS</div>
                                  ${items.map(i => row(i[0], i[1], i[2], false)).join('')}
                                  <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0 2px 0;font-size:12px;box-sizing:border-box;width:100%;">
                                    <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                                      <ha-icon icon="mdi:tire" style="--mdc-icon-size:16px;color:${tyre ? '#fbbf24' : '#22c55e'};flex-shrink:0;"></ha-icon>
                                      <span style="color:#e2e8f0;white-space:nowrap;">Tire Pressure (TPMS)</span>
                                    </div>
                                    <span style="font-size:9.5px;font-weight:800;color:${tyre ? '#fbbf24' : '#22c55e'};background:${tyre ? 'rgba(251,191,36,0.16)' : 'rgba(34,197,94,0.12)'};padding:2px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-right:4px;">${tyre ? 'ALERT' : 'NOMINAL (4)'}</span>
                                  </div>
                                </div>`;
                            ]]]
            styles:
              card:
                - background: radial-gradient(ellipse at 50% 12%, #182e46 0%, #0a111a 62%, #040609 100%)
                - border-radius: 22px
                - border: 1px solid rgba(255, 255, 255, 0.09)
                - box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75)
                - padding: 12px 16px 14px 16px
                - overflow: hidden
                - position: relative
                - cursor: pointer
              grid:
                - grid-template-areas: '"c"'
                - grid-template-columns: 1fr
              custom_fields:
                c:
                  - width: 100%
            custom_fields:
              c: |
                [[[
                  const S = e => states[e]?.state;
                  const num = e => Number(S(e));
                  const on = e => S(e) === 'on';

                  const soc = isFinite(num('sensor.ev9_ev_battery_level')) ? Math.min(100, Math.max(0, Math.round(num('sensor.ev9_ev_battery_level')))) : 31;
                  const rng = isFinite(num('sensor.ev9_ev_range')) ? Math.max(0, Math.round(num('sensor.ev9_ev_range'))) : 96;
                  const chg = on('binary_sensor.ev9_ev_battery_charge');
                  const plug = on('binary_sensor.ev9_ev_battery_plug');
                  const kw = num('sensor.ev9_ev_charging_power');
                  const locked = S('lock.ev9_door_lock') === 'locked';
                  const climOn = on('switch.ev9_climate');

                  const cAttr = states['climate.ev9_climate_control']?.attributes || {};
                  const cTarget = Number(cAttr.temperature);
                  const cCur = Number(cAttr.current_temperature);
                  const unit = hass.config.unit_system.temperature || '°F';
                  const isF = unit === '°F';

                  let thermal = 'none';
                  if (climOn) {
                    if (isFinite(cCur) && isFinite(cTarget)) {
                      thermal = cTarget >= cCur + 0.5 ? 'warming' : 'cooling';
                    } else if (isFinite(cTarget)) {
                      thermal = cTarget >= (isF ? 72 : 22) ? 'warming' : 'cooling';
                    } else {
                      thermal = 'cooling';
                    }
                  }

                  const isDc = chg && isFinite(kw) && kw > 25;
                  const chgCol = isDc ? '#38bdf8' : '#22c55e';
                  const chgBg = isDc ? 'rgba(56, 189, 248, 0.16)' : 'rgba(34, 197, 94, 0.16)';
                  const chgBorder = isDc ? 'rgba(56, 189, 248, 0.48)' : 'rgba(34, 197, 94, 0.45)';
                  const rawMins = Number(
                    states['sensor.ev9_ev_battery_charge_remaining_time']?.state ??
                    states['sensor.ev9_charging_time_left']?.state ??
                    states['sensor.ev9_ev_time_to_full_charge']?.state ??
                    states['sensor.ev9_ev_battery_level']?.attributes?.time_to_full_charge ??
                    NaN
                  );
                  let etaTxt = '';
                  if (chg && isFinite(rawMins) && rawMins > 0) {
                    const totalM = Math.round(rawMins);
                    const h = Math.floor(totalM / 60);
                    const m = totalM % 60;
                    etaTxt = h > 0 ? ` · ${h}h ${m}m` : ` · ${m}m`;
                  }
                  const pwrAndEta = `${isFinite(kw) && kw > 0 ? ` · ${kw.toFixed(1)} kW` : ''}${etaTxt}`;

                  const thermalCol = thermal === 'warming' ? '#ff7b29' : '#38bdf8';
                  const statusCol = chg ? chgCol : climOn ? thermalCol : '#38bdf8';
                  const glowAura = chg
                    ? (isDc ? 'rgba(56, 189, 248, 0.45)' : 'rgba(34, 197, 94, 0.42)')
                    : climOn
                      ? (thermal === 'warming' ? 'rgba(255, 123, 41, 0.44)' : 'rgba(56, 189, 248, 0.42)')
                      : 'rgba(56, 189, 248, 0.28)';

                  const socCol = soc <= 20 ? '#ef4444' : soc > 70 ? '#22c55e' : soc <= 40 ? '#f59e0b' : '#38bdf8';
                  const fullGradient = 'linear-gradient(90deg, #ef4444 0%, #ef4444 20%, #f59e0b 40%, #eab308 55%, #38bdf8 68%, #22c55e 78%, #22c55e 100%)';
                  const lim = Math.min(100, Math.max(10, num(isDc ? 'number.ev9_dc_charging_limit' : 'number.ev9_ac_charging_limit') || 80));
                  const clipRight = Math.max(0, 100 - soc);

                  const topPills = [];
                  if (chg) {
                    topPills.push(`
                      <div style="display:inline-flex;align-items:center;gap:5px;background:${chgBg};border:1px solid ${chgBorder};color:${chgCol};padding:3.5px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;backdrop-filter:blur(6px);">
                        <span>${isDc ? 'DC FAST' : 'CHARGING'}${pwrAndEta}</span>
                      </div>`);
                  } else if (plug) {
                    topPills.push(`
                      <div style="display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,0.14);border:1px solid rgba(56,189,248,0.4);color:#38bdf8;padding:3.5px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;backdrop-filter:blur(6px);">
                        <span>PLUGGED</span>
                      </div>`);
                  }

                  if (climOn) {
                    topPills.push(`
                      <div style="display:inline-flex;align-items:center;gap:4px;padding:3.5px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.04em;color:${thermal === 'warming' ? '#fed7aa' : '#bae6fd'};background:${thermal === 'warming' ? 'rgba(194,65,12,0.42)' : 'rgba(3,105,161,0.42)'};border:1px solid ${thermalCol}88;backdrop-filter:blur(6px);white-space:nowrap;">
                        <ha-icon icon="${thermal === 'warming' ? 'mdi:fire' : 'mdi:snowflake'}" style="--mdc-icon-size:13px;color:${thermalCol};"></ha-icon>
                        <span>${thermal === 'warming' ? 'WARMING' : 'COOLING'}</span>
                      </div>`);
                  }

                  const exceptions = [];
                  if (!locked) exceptions.push({ label: 'UNLOCKED', icon: 'mdi:lock-open-variant', col: '#fbbf24' });
                  if (on('binary_sensor.ev9_front_left_door')) exceptions.push({ label: 'FL DOOR', icon: 'mdi:car-door', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_front_right_door')) exceptions.push({ label: 'FR DOOR', icon: 'mdi:car-door', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_back_left_door')) exceptions.push({ label: 'RL DOOR', icon: 'mdi:car-door', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_back_right_door')) exceptions.push({ label: 'RR DOOR', icon: 'mdi:car-door', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_hood')) exceptions.push({ label: 'FRUNK OPEN', icon: 'mdi:car', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_trunk')) exceptions.push({ label: 'TRUNK OPEN', icon: 'mdi:car', col: '#f43f5e' });
                  if (on('binary_sensor.ev9_sunroof')) exceptions.push({ label: 'SUNROOF OPEN', icon: 'mdi:window-closed-variant', col: '#fbbf24' });
                  if (on('binary_sensor.ev9_tire_pressure_all')) exceptions.push({ label: 'LOW TIRE PSI', icon: 'mdi:tire', col: '#f43f5e' });

                  const topStrip = topPills.length > 0 ? `
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-start;margin-bottom:6px;z-index:4;position:relative;">
                      ${topPills.join('')}
                    </div>` : '';

                  const bottomStrip = exceptions.length > 0 ? `
                    <div style="display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 2px 0;z-index:4;position:relative;">
                      ${exceptions.map(x => `
                        <div style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:${x.col}18;border:1px solid ${x.col}55;color:${x.col};font-size:9px;font-weight:900;letter-spacing:0.06em;white-space:nowrap;">
                          <ha-icon icon="${x.icon}" style="--mdc-icon-size:12px;color:${x.col};"></ha-icon>
                          ${x.label}
                        </div>
                      `).join('')}
                    </div>` : '';

                  const cable = chg ? `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3;opacity:1;">
                      <defs>
                        <linearGradient id="evseBody" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#64748b" />
                          <stop offset="45%" stop-color="#334155" />
                          <stop offset="100%" stop-color="#0f172a" />
                        </linearGradient>
                        <filter id="chargerGlow" x="-50%" y="-50%" width="200%" height="200%">
                          <feGaussianBlur stdDeviation="1.4" result="blur" />
                          <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                      </defs>
                      <ellipse cx="6.5" cy="91" rx="6.5" ry="1.8" fill="rgba(148, 163, 184, 0.35)" />
                      <rect x="2.5" y="89.5" width="8" height="2.2" rx="0.8" fill="#64748b" stroke="rgba(255,255,255,0.28)" stroke-width="0.5" />
                      <rect x="4.9" y="54" width="3.2" height="35.5" rx="0.7" fill="url(#evseBody)" stroke="rgba(255,255,255,0.22)" stroke-width="0.45" />
                      <rect x="2.6" y="37" width="7.8" height="18" rx="1.8" fill="#0f172a" stroke="rgba(255,255,255,0.32)" stroke-width="0.6" />
                      <rect x="3.8" y="39.5" width="5.4" height="13" rx="1.1" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.16)" stroke-width="0.4" />
                      <rect x="4.6" y="42" width="3.8" height="3.2" rx="0.7" fill="${chgCol}" opacity="0.95" filter="url(#chargerGlow)" />
                      <line x1="4.6" y1="48" x2="8.4" y2="48" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
                      <path d="M10.4 51 C 11.5 76, 20 75, 26 49" fill="none" stroke="${chgCol}" stroke-width="2.75" stroke-dasharray="3 3" stroke-linecap="round" vector-effect="non-scaling-stroke">
                        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="${isDc ? '0.8s' : '1.3s'}" repeatCount="indefinite" />
                      </path>
                      <circle cx="27" cy="49" r="1.45" fill="${chgCol}" />
                    </svg>` : plug ? `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3;opacity:1;">
                      <defs>
                        <linearGradient id="evseBodyPlug" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#64748b" />
                          <stop offset="45%" stop-color="#334155" />
                          <stop offset="100%" stop-color="#0f172a" />
                        </linearGradient>
                      </defs>
                      <ellipse cx="6.5" cy="91" rx="6.5" ry="1.8" fill="rgba(148, 163, 184, 0.35)" />
                      <rect x="2.5" y="89.5" width="8" height="2.2" rx="0.8" fill="#64748b" stroke="rgba(255,255,255,0.28)" stroke-width="0.5" />
                      <rect x="4.9" y="54" width="3.2" height="35.5" rx="0.7" fill="url(#evseBodyPlug)" stroke="rgba(255,255,255,0.22)" stroke-width="0.45" />
                      <rect x="2.6" y="37" width="7.8" height="18" rx="1.8" fill="#0f172a" stroke="rgba(255,255,255,0.32)" stroke-width="0.6" />
                      <rect x="3.8" y="39.5" width="5.4" height="13" rx="1.1" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.16)" stroke-width="0.4" />
                      <rect x="4.6" y="42" width="3.8" height="3.2" rx="0.7" fill="#38bdf8" opacity="0.65" />
                      <line x1="4.6" y1="48" x2="8.4" y2="48" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
                      <path d="M10.4 51 C 11.5 76, 20 75, 26 49" fill="none" stroke="#38bdf8" stroke-width="2.75" stroke-linecap="round" opacity="0.55" vector-effect="non-scaling-stroke" />
                      <circle cx="27" cy="49" r="1.35" fill="#38bdf8" opacity="0.65" />
                    </svg>` : '';

                  const heroThermalFx = climOn ? `
                    <div style="position:absolute;inset:2px;z-index:1;pointer-events:none;border-radius:20px;background:radial-gradient(ellipse at 50% 55%,${thermal === 'warming' ? 'rgba(255,123,41,0.28)' : 'rgba(56,189,248,0.26)'} 0%,transparent 70%);animation:heroBreath 2.4s ease-in-out infinite alternate;"></div>` : '';

                  return `
                    <div style="display:flex;flex-direction:column;gap:10px;padding:2px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
                      ${topStrip}

                      <div style="position:relative;width:100%;height:256px;display:flex;align-items:center;justify-content:center;padding:4px 8px;box-sizing:border-box;">
                        <div style="position:absolute;bottom:8px;width:92%;height:64px;background:radial-gradient(ellipse at 50% 60%,${glowAura} 0%,transparent 74%);filter:blur(26px);z-index:1;"></div>
                        <div style="position:absolute;bottom:4px;width:78%;height:1px;background:linear-gradient(90deg,transparent,${statusCol},transparent);opacity:0.65;z-index:1;"></div>
                        ${heroThermalFx}
                        ${cable}
                        <div style="position:relative;z-index:2;width:98%;max-width:580px;">
                          <img src="/local/ev9/hero.png" style="width:100%;height:auto;display:block;filter:drop-shadow(0 22px 30px rgba(0,0,0,0.94)) ${climOn ? `drop-shadow(0 0 16px ${thermalCol}66)` : ''};transform:scale(1.10);transition:filter 0.35s ease;" />
                        </div>
                      </div>

                      ${bottomStrip}

                      <div style="background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:12px 16px;box-sizing:border-box;">
                        <div style="display:flex;justify-content:flex-start;align-items:baseline;gap:10px;padding:0 2px;">
                          <div style="display:flex;align-items:baseline;gap:1px;">
                            <span style="font-size:26px;font-weight:900;color:#ffffff;line-height:1;">${soc}</span>
                            <span style="font-size:14px;font-weight:800;color:${socCol};line-height:1;">%</span>
                          </div>
                          <span style="font-size:29px;font-weight:300;color:rgba(255,255,255,0.22);line-height:1;user-select:none;">|</span>
                          <div style="display:flex;align-items:baseline;gap:3px;">
                            <span style="font-size:26px;font-weight:900;color:${socCol};line-height:1;">${rng}</span>
                            <span style="font-size:12px;font-weight:800;color:#94a3b8;letter-spacing:0.02em;">mi</span>
                          </div>
                        </div>

                        <div style="position:relative;width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:999px;margin-top:9px;overflow:visible;">
                          <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:${fullGradient};clip-path:inset(0 ${clipRight}% 0 0 round 999px);border-radius:999px;transition:clip-path 0.8s ease;"></div>
                          ${chg ? `<div style="position:absolute;top:0;left:0;width:100%;height:100%;clip-path:inset(0 ${clipRight}% 0 0 round 999px);overflow:hidden;pointer-events:none;z-index:1;"><div style="position:absolute;top:-2px;bottom:-2px;width:28%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.72) 50%,transparent 100%);filter:blur(1px);animation:barTravel ${isDc ? '1.1s' : '1.9s'} ease-in-out infinite;"></div></div>` : ''}
                          <div title="Limit ${lim}%" style="position:absolute;top:-3px;bottom:-3px;left:${lim}%;width:2.5px;background:#ffffff;border-radius:2px;box-shadow:0 0 6px #ffffff;z-index:2;"></div>
                        </div>

                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:9px;font-weight:700;color:#78889b;">
                          <span>0%</span>
                          <span>LIMIT ${lim}% · TAP FOR DETAILS</span>
                          <span>100%</span>
                        </div>
                      </div>
                    </div>
                    <style>
                      @keyframes pDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
                      @keyframes heroBreath { from { opacity: 0.65; } to { opacity: 1; } }
                              @keyframes barTravel { 0% { left: -28%; opacity: 0.25; } 50% { opacity: 1; } 100% { left: 100%; opacity: 0.25; } }
                    </style>`;
                ]]]

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: lock.ev9_door_lock
                name: "[[[ return entity.state === 'locked' ? 'Locked' : 'Unlocked'; ]]]"
                icon: "[[[ return entity.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open-variant'; ]]]"
                tap_action:
                  action: toggle
                  confirmation:
                    text: "[[[ return entity.state === 'locked' ? 'Unlock EV9 doors?' : 'Lock EV9 doors?'; ]]]"
                styles:
                  card:
                    - background: "[[[ return entity.state === 'locked' ? 'linear-gradient(160deg,rgba(34,197,94,0.12) 0%,rgba(255,255,255,0.03) 100%)' : 'linear-gradient(160deg,rgba(251,191,36,0.14) 0%,rgba(255,255,255,0.03) 100%)'; ]]]"
                    - border-radius: 16px
                    - border: "[[[ return entity.state === 'locked' ? '1px solid rgba(34,197,94,0.32)' : '1px solid rgba(251,191,36,0.4)'; ]]]"
                    - padding: 11px 8px
                    - cursor: pointer
                  icon:
                    - color: "[[[ return entity.state === 'locked' ? '#22c55e' : '#fbbf24'; ]]]"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - font-weight: 800
                    - color: "#e2e8f0"
                    - margin-top: 3px
              - type: custom:button-card
                entity: button.ev9_start_hazard_lights
                name: Flash
                icon: mdi:alarm-light-outline
                tap_action:
                  action: call-service
                  service: script.ev9_safe_action
                  data:
                    target_action: button.press
                    target_entity: button.ev9_start_hazard_lights
                styles:
                  card:
                    - background: linear-gradient(160deg, rgba(251, 191, 36, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%)
                    - border-radius: 16px
                    - border: 1px solid rgba(251, 191, 36, 0.25)
                    - padding: 11px 8px
                    - cursor: pointer
                  icon:
                    - color: "#fbbf24"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - font-weight: 800
                    - color: "#e2e8f0"
                    - margin-top: 3px
              - type: custom:button-card
                entity: device_tracker.ev9_location
                name: Locate
                icon: mdi:crosshairs-gps
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: EV9 Location
                      size: normal
                      dismissable: true
                      content:
                        type: map
                        entities:
                          - device_tracker.ev9_location
                        default_zoom: 15
                styles:
                  card:
                    - background: linear-gradient(160deg, rgba(56, 189, 248, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%)
                    - border-radius: 16px
                    - border: 1px solid rgba(56, 189, 248, 0.28)
                    - padding: 11px 8px
                    - cursor: pointer
                  icon:
                    - color: "#38bdf8"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - font-weight: 800
                    - color: "#e2e8f0"
                    - margin-top: 3px

          - type: vertical-stack
            cards:
              - type: custom:button-card
                entity: switch.ev9_climate
                triggers_update:
                  - climate.ev9_climate_control
                show_name: false
                show_icon: false
                tap_action:
                  action: toggle
                hold_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Climate & Comfort Systems
                      size: normal
                      dismissable: true
                      content:
                        type: vertical-stack
                        cards:
                          - type: thermostat
                            entity: climate.ev9_climate_control
                          - type: entities
                            title: Comfort Features
                            entities:
                              - switch.ev9_climate
                              - binary_sensor.ev9_air_conditioner
                              - binary_sensor.ev9_defrost
                              - binary_sensor.ev9_steering_wheel_heater
                              - binary_sensor.ev9_side_mirror_heater
                              - binary_sensor.ev9_back_window_heater
                              - binary_sensor.ev9_ev_battery_precondition
                styles:
                  card:
                    - background: |-
                        [[[
                          if (entity.state !== 'on') return 'rgba(255, 255, 255, 0.035)';
                          const t = Number(states['climate.ev9_climate_control']?.attributes?.temperature);
                          const cur = Number(states['climate.ev9_climate_control']?.attributes?.current_temperature);
                          const isF = hass.config.unit_system.temperature === '°F';
                          const warm = isFinite(cur) && isFinite(t) ? t > cur + 0.5 : (isFinite(t) ? t >= (isF ? 72 : 22) : false);
                          return warm
                            ? 'linear-gradient(135deg, rgba(255, 123, 41, 0.24) 0%, rgba(28, 14, 8, 0.96) 100%)'
                            : 'linear-gradient(135deg, rgba(56, 189, 248, 0.22) 0%, rgba(10, 20, 30, 0.95) 100%)';
                        ]]]
                    - border-radius: 18px 18px 0 0
                    - border: |-
                        [[[
                          if (entity.state !== 'on') return '1px solid rgba(255, 255, 255, 0.08)';
                          const t = Number(states['climate.ev9_climate_control']?.attributes?.temperature);
                          const cur = Number(states['climate.ev9_climate_control']?.attributes?.current_temperature);
                          const isF = hass.config.unit_system.temperature === '°F';
                          const warm = isFinite(cur) && isFinite(t) ? t > cur + 0.5 : (isFinite(t) ? t >= (isF ? 72 : 22) : false);
                          return warm ? '1px solid rgba(255, 123, 41, 0.55)' : '1px solid rgba(56, 189, 248, 0.5)';
                        ]]]
                    - border-bottom: none
                    - padding: 11px 14px
                    - overflow: hidden
                  grid:
                    - grid-template-areas: '"c"'
                    - grid-template-columns: 1fr
                  custom_fields:
                    c:
                      - width: 100%
                custom_fields:
                  c: |
                    [[[
                      const on = entity.state === 'on';
                      const attr = states['climate.ev9_climate_control']?.attributes || {};
                      const t = Number(attr.temperature);
                      const cur = Number(attr.current_temperature);
                      const unit = hass.config.unit_system.temperature || '°F';
                      const isF = unit === '°F';
                      const tVal = isFinite(t) ? Math.round(t) : 72;
                      const temp = tVal + unit;

                      let mode = 'off';
                      if (on) {
                        if (isFinite(cur) && isFinite(t)) {
                          mode = t >= cur + 0.5 ? 'warming' : 'cooling';
                        } else if (isFinite(t)) {
                          mode = t >= (isF ? 72 : 22) ? 'warming' : 'cooling';
                        } else {
                          mode = 'cooling';
                        }
                      }

                      const accent = mode === 'warming' ? '#ff7b29' : '#38bdf8';
                      const validCur = isFinite(cur) && cur > (isF ? 32 : 0);
                      const subText = !on
                        ? 'HVAC Standby · Tap to Start'
                        : (validCur ? `${mode === 'warming' ? 'WARMING' : 'COOLING'} · ${Math.round(cur)}${unit} → ${temp}` : `${mode === 'warming' ? 'WARMING CABIN' : 'COOLING CABIN'} · Target ${temp}`);

                      const pct = Math.min(100, Math.max(0, ((tVal - (isF ? 55 : 13)) / (isF ? 35 : 19)) * 100));
                      const ringCirc = 2 * Math.PI * 16;
                      const ringDash = (pct / 100) * ringCirc;

                      const waves = on ? `
                        <svg viewBox="0 0 240 48" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:${mode === 'warming' ? '0.32' : '0.28'};">
                          <path d="M-40 16 Q 20 ${mode === 'warming' ? '4' : '28'}, 80 16 T 200 16 T 320 16" fill="none" stroke="${accent}" stroke-width="2" stroke-linecap="round">
                            <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
                              values="${mode === 'warming'
                                ? 'M-40 24 Q 20 8, 80 24 T 200 24 T 320 24;M-40 18 Q 20 30, 80 18 T 200 18 T 320 18;M-40 24 Q 20 8, 80 24 T 200 24 T 320 24'
                                : 'M-40 14 Q 20 28, 80 14 T 200 14 T 320 14;M-40 20 Q 20 8, 80 20 T 200 20 T 320 20;M-40 14 Q 20 28, 80 14 T 200 14 T 320 14'}" />
                          </path>
                        </svg>` : '';

                      return `
                        <div style="position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
                          ${waves}
                          <div style="position:relative;z-index:1;display:flex;align-items:center;gap:11px;min-width:0;">
                            <div style="width:36px;height:36px;border-radius:11px;background:${on ? accent : 'rgba(255,255,255,0.06)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:${on ? `0 0 16px ${accent}88` : 'none'};transition:background 0.25s ease;">
                              <ha-icon icon="${mode === 'warming' ? 'mdi:fire' : on ? 'mdi:snowflake' : 'mdi:fan'}" style="--mdc-icon-size:20px;color:${on ? '#080c10' : '#a0aec0'};${on ? 'animation:fSpin 2.2s linear infinite;' : ''}"></ha-icon>
                            </div>
                            <div style="min-width:0;">
                              <div style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:14px;font-weight:800;color:#ffffff;">Cabin Climate</span>
                                ${on ? `<span style="font-size:8.5px;font-weight:900;letter-spacing:0.08em;color:${accent};background:${accent}22;border:1px solid ${accent}66;padding:1px 6px;border-radius:5px;animation:pulseBadge 1.6s ease-in-out infinite;">${mode === 'warming' ? 'HEAT' : 'A/C'}</span>` : ''}
                              </div>
                              <div style="font-size:10px;font-weight:600;color:${on ? accent : '#78889b'};margin-top:1px;">${subText}</div>
                            </div>
                          </div>
                          <div style="position:relative;z-index:1;display:flex;align-items:center;gap:6px;flex-shrink:0;">
                            <div style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
                              <svg viewBox="0 0 40 40" style="width:40px;height:40px;transform:rotate(-90deg);">
                                <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3.5" />
                                <circle cx="20" cy="20" r="16" fill="none" stroke="${on ? accent : '#38bdf8'}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${ringDash} ${ringCirc}" />
                              </svg>
                              <span style="position:absolute;font-size:11.5px;font-weight:900;color:${on ? accent : '#ffffff'};">${tVal}°</span>
                            </div>
                          </div>
                        </div>
                        <style>
                          @keyframes fSpin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
                          @keyframes pulseBadge { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
                        </style>`;
                    ]]]
