                      <div style="height:3px;background:rgba(255,255,255,0.08);border-radius:999px;margin-top:4px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:${barCol};border-radius:999px;"></div>
                      </div>
                    </div>`;
                  return `
                    <div style="text-align:left;padding:0 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
