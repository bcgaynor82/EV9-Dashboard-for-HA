# =============================================================================
# EV9 package: helpers, insight sensors, smart charging, safety alerts & departure
# Save as: /config/packages/ev9.yaml
#
# configuration.yaml must include:
#   homeassistant:
#     packages: !include_dir_named packages
# =============================================================================

input_boolean:
  ev9_notifications:
    name: EV9 alerts
    icon: mdi:bell-outline
  ev9_departure_enabled:
    name: EV9 departure planner
    icon: mdi:clock-outline
  ev9_departure_weekdays:
    name: EV9 departure weekdays only
    icon: mdi:calendar-week

input_datetime:
  ev9_ready_by:
    name: EV9 ready by
    has_date: false
    has_time: true

input_text:
  ev9_notify_service:
    name: EV9 notify service
    max: 100

input_number:
  # --- User settings ---
  ev9_battery_kwh:
    name: EV9 usable battery capacity
    min: 40
    max: 150
    step: 0.1
    unit_of_measurement: kWh
    mode: box
  ev9_electricity_rate:
    name: EV9 electricity rate
    min: 0
    max: 2
    step: 0.001
    mode: box
  ev9_charge_efficiency:
    name: EV9 charging efficiency
    min: 0.5
    max: 1
    step: 0.01
    mode: box
  ev9_home_charge_kw:
    name: EV9 home charger power
    min: 1.4
    max: 22
    step: 0.1
    unit_of_measurement: kW
    mode: box
  ev9_low_12v:
    name: EV9 low 12 V alert threshold
    min: 30
    max: 80
    step: 1
    unit_of_measurement: "%"
    mode: box
  ev9_departure_temp:
    name: EV9 departure cabin temperature
    min: 60
    max: 85
    step: 1
    mode: box
  ev9_departure_lead:
    name: EV9 climate lead time
    min: 10
    max: 45
    step: 5
    unit_of_measurement: min
    mode: box
  ev9_departure_buffer:
    name: EV9 charge finish buffer
    min: 15
    max: 120
    step: 5
    unit_of_measurement: min
    mode: box

  # --- Internal session state tracking ---
  ev9_session_start_soc:
    name: EV9 session start SOC
    min: 0
    max: 100
    step: 0.1
    mode: box
  ev9_session_start_range:
    name: EV9 session start range
    min: 0
    max: 2000
    step: 1
    mode: box
  ev9_last_session_kwh:
    name: EV9 last session kWh
    min: 0
    max: 300
    step: 0.1
    mode: box
  ev9_last_session_range:
    name: EV9 last session range added
    min: 0
    max: 2000
    step: 1
    mode: box
  ev9_eff_ref_odo:
    name: EV9 efficiency ref odometer
    min: 0
    max: 2000000
    step: 0.1
    mode: box
  ev9_eff_ref_soc:
    name: EV9 efficiency ref SOC
    min: 0
    max: 100
    step: 0.1
    mode: box
  ev9_efficiency:
    name: EV9 calculated efficiency
    min: 0
    max: 20
    step: 0.01
    mode: box

template:
  - sensor:
      - name: EV9 session kWh
        unique_id: ev9_session_kwh
        unit_of_measurement: kWh
        device_class: energy
        state: >
          {% if is_state('binary_sensor.ev9_ev_battery_charge', 'on') %}
            {% set d = states('sensor.ev9_ev_battery_level')|float(0) - states('input_number.ev9_session_start_soc')|float(0) %}
            {{ (([d, 0]|max) / 100 * states('input_number.ev9_battery_kwh')|float(99.8)) | round(1) }}
          {% else %}
            {{ states('input_number.ev9_last_session_kwh')|float(0) }}
          {% endif %}

      - name: EV9 session cost
        unique_id: ev9_session_cost
        state: >
          {{ (states('sensor.ev9_session_kwh')|float(0) / states('input_number.ev9_charge_efficiency')|float(0.9)
             * states('input_number.ev9_electricity_rate')|float(0.15)) | round(2) }}

      - name: EV9 session range added
        unique_id: ev9_session_range_added
        state: >
          {% if is_state('binary_sensor.ev9_ev_battery_charge', 'on') %}
            {{ ([states('sensor.ev9_ev_range')|float(0) - states('input_number.ev9_session_start_range')|float(0), 0]|max) | round(0) }}
          {% else %}
            {{ states('input_number.ev9_last_session_range')|float(0) }}
          {% endif %}

      - name: EV9 efficiency
        unique_id: ev9_efficiency
        availability: "{{ states('input_number.ev9_efficiency')|float(0) > 0 }}"
        state: "{{ states('input_number.ev9_efficiency')|float(0) | round(2) }}"

      - name: EV9 energy to limit
        unique_id: ev9_energy_to_limit
        unit_of_measurement: kWh
        state: >
          {% set soc = states('sensor.ev9_ev_battery_level')|float(0) %}
          {% set dc = is_state('binary_sensor.ev9_ev_battery_charge', 'on') and (states('sensor.ev9_ev_charging_power')|float(0) > 25) %}
          {% set limit = states(dc | iif('number.ev9_dc_charging_limit', 'number.ev9_ac_charging_limit'))|float(80) %}
          {% set cap = states('input_number.ev9_battery_kwh')|float(99.8) %}
          {{ [((limit - soc) / 100 * cap), 0]|max | round(1) }}

      - name: EV9 cost to limit
        unique_id: ev9_cost_to_limit
        state: >
          {% set kwh = states('sensor.ev9_energy_to_limit')|float(0) %}
          {% set rate = states('input_number.ev9_electricity_rate')|float(0.15) %}
          {% set eff = states('input_number.ev9_charge_efficiency')|float(0.9) %}
          {{ (kwh / eff * rate) | round(2) }}

script:
  ev9_notify:
    alias: EV9 notify
    description: Dispatches push notifications via configured mobile service.
    fields:
      title:
        description: Notification title
        example: EV9
      message:
        description: Notification text
        example: Charging complete
    sequence:
      - condition: state
        entity_id: input_boolean.ev9_notifications
        state: "on"
      - condition: template
        value_template: "{{ states('input_text.ev9_notify_service') | length > 0 }}"
      - action: "{{ states('input_text.ev9_notify_service') }}"
        continue_on_error: true
        data:
          title: "{{ title | default('EV9') }}"
          message: "{{ message }}"

automation:
  # ----------------------------------------------------------- Configuration defaults
  - id: ev9_defaults
    alias: EV9 apply default parameters
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - if:
          - condition: template
            value_template: "{{ states('input_number.ev9_battery_kwh')|float(0) <= 40 }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.ev9_battery_kwh}
            data: {value: 99.8}
      - if:
          - condition: template
            value_template: "{{ states('input_number.ev9_electricity_rate')|float(0) <= 0 }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.ev9_electricity_rate}
            data: {value: 0.15}
      - if:
          - condition: template
            value_template: "{{ states('input_number.ev9_charge_efficiency')|float(0) <= 0.5 }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.ev9_charge_efficiency}
            data: {value: 0.90}
      - if:
          - condition: template
            value_template: "{{ states('input_number.ev9_home_charge_kw')|float(0) <= 1.4 }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.ev9_home_charge_kw}
            data: {value: 9.6}
      - if:
          - condition: template
            value_template: "{{ states('input_number.ev9_departure_temp')|float(0) <= 60 }}"
        then:
          - action: input_number.set_value
            target: {entity_id: input_number.ev9_departure_temp}
            data: {value: 70}
      - if:
          - condition: template
            value_template: "{{ states('input_text.ev9_notify_service') | length == 0 }}"
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.ev9_notify_service}
            data: {value: notify.notify}

  # ----------------------------------------------------------- Charging session lifecycle
  - id: ev9_session_start
    alias: EV9 session start recorder
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        to: "on"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_session_start_soc}
        data: {value: "{{ states('sensor.ev9_ev_battery_level')|float(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_session_start_range}
        data: {value: "{{ states('sensor.ev9_ev_range')|float(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_eff_ref_odo}
        data: {value: "{{ states('sensor.ev9_odometer')|float(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_eff_ref_soc}
        data: {value: "{{ states('sensor.ev9_ev_battery_level')|float(0) }}"}

  - id: ev9_session_end
    alias: EV9 session end recorder
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        from: "on"
        to: "off"
        for: "00:01:30"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_last_session_kwh}
        data:
          value: >
            {{ (([states('sensor.ev9_ev_battery_level')|float(0) - states('input_number.ev9_session_start_soc')|float(0), 0]|max) / 100
               * states('input_number.ev9_battery_kwh')|float(99.8)) | round(1) }}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_last_session_range}
        data:
          value: >
            {{ ([states('sensor.ev9_ev_range')|float(0) - states('input_number.ev9_session_start_range')|float(0), 0]|max) | round(0) }}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_eff_ref_odo}
        data: {value: "{{ states('sensor.ev9_odometer')|float(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.ev9_eff_ref_soc}
        data: {value: "{{ states('sensor.ev9_ev_battery_level')|float(0) }}"}

  # ----------------------------------------------------------- Running efficiency filter
  - id: ev9_efficiency_update
    alias: EV9 recalculate driving efficiency
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.ev9_odometer
    conditions:
      - condition: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        state: "off"
      - condition: template
        value_template: "{{ is_number(states('sensor.ev9_odometer')) and is_number(states('sensor.ev9_ev_battery_level')) }}"
    actions:
      - variables:
          odo: "{{ states('sensor.ev9_odometer')|float(0) }}"
          soc: "{{ states('sensor.ev9_ev_battery_level')|float(0) }}"
          ref_odo: "{{ states('input_number.ev9_eff_ref_odo')|float(0) }}"
          ref_soc: "{{ states('input_number.ev9_eff_ref_soc')|float(0) }}"
          cap: "{{ states('input_number.ev9_battery_kwh')|float(99.8) }}"
          old: "{{ states('input_number.ev9_efficiency')|float(0) }}"
          d_odo: "{{ odo - ref_odo }}"
          d_soc: "{{ ref_soc - soc }}"
      - choose:
          # Reference is missing or stale: restart the measurement window.
          - conditions:
              - condition: template
                value_template: "{{ ref_odo == 0 or d_odo < 0 or d_soc < 0 }}"
            sequence:
              - action: input_number.set_value
                target: {entity_id: input_number.ev9_eff_ref_odo}
                data: {value: "{{ odo }}"}
              - action: input_number.set_value
                target: {entity_id: input_number.ev9_eff_ref_soc}
                data: {value: "{{ soc }}"}
          # Enough distance and battery used: take a sample and smooth it.
          - conditions:
              - condition: template
                value_template: "{{ d_odo >= 10 and d_soc >= 2 }}"
            sequence:
              - variables:
                  eff_sample: "{{ d_odo / (d_soc / 100 * cap) }}"
              - if:
                  - condition: template
                    value_template: "{{ 0.8 <= eff_sample <= 10 }}"
                then:
                  - action: input_number.set_value
                    target: {entity_id: input_number.ev9_efficiency}
                    data: {value: "{{ (eff_sample if old <= 0 else (0.75 * old + 0.25 * eff_sample)) | round(2) }}"}
              - action: input_number.set_value
                target: {entity_id: input_number.ev9_eff_ref_odo}
                data: {value: "{{ odo }}"}
              - action: input_number.set_value
                target: {entity_id: input_number.ev9_eff_ref_soc}
                data: {value: "{{ soc }}"}

  # ----------------------------------------------------------- Push notifications & safety
  - id: ev9_alert_charge_done
    alias: EV9 notify charge complete
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        from: "on"
        to: "off"
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.ev9_ev_battery_plug
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.ev9_ev_battery_level')|float(0) >=
             ([states('number.ev9_ac_charging_limit')|float(100), states('number.ev9_dc_charging_limit')|float(100)]|min) - 2 }}
    actions:
      - action: script.ev9_notify
        data:
          title: "EV9 Charging Finished"
          message: "Reached {{ states('sensor.ev9_ev_battery_level')|round(0) }}%. Added {{ states('sensor.ev9_session_kwh') }} kWh."

  - id: ev9_alert_unlocked
    alias: EV9 notify left unlocked
    triggers:
      - trigger: state
        entity_id: lock.ev9_door_lock
        to: unlocked
        for: "00:15:00"
    actions:
      - action: script.ev9_notify
        data:
          title: "EV9 Unlocked"
          message: "Doors have remained unlocked for 15 minutes."

  - id: ev9_alert_closures_open
    alias: EV9 notify doors or trunk open
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev9_front_left_door
          - binary_sensor.ev9_front_right_door
          - binary_sensor.ev9_back_left_door
          - binary_sensor.ev9_back_right_door
          - binary_sensor.ev9_hood
          - binary_sensor.ev9_trunk
          - binary_sensor.ev9_sunroof
        to: "on"
        for: "00:10:00"
    actions:
      - action: script.ev9_notify
        data:
          title: "EV9 Open Closure"
          message: "{{ trigger.to_state.name }} has been open for 10 minutes."

  - id: ev9_alert_plugged_not_charging
    alias: EV9 notify plugged in but idle
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev9_ev_battery_plug
        to: "on"
        for: "00:20:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        state: "off"
      - condition: template
        value_template: >
          {{ states('sensor.ev9_ev_battery_level')|float(0) <
             ([states('number.ev9_ac_charging_limit')|float(100), states('number.ev9_dc_charging_limit')|float(100)]|min) - 3 }}
    actions:
      - action: script.ev9_notify
        data:
          title: "EV9 Plugged In Idle"
          message: "Plugged in at {{ states('sensor.ev9_ev_battery_level')|round(0) }}% but charging has not initiated."

  - id: ev9_alert_low_12v
    alias: EV9 notify 12V battery low
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ev9_car_battery_level
        below: input_number.ev9_low_12v
        for: "00:20:00"
    actions:
      - action: script.ev9_notify
        data:
          title: "EV9 12V Warning"
          message: "12V battery level has dropped to {{ states('sensor.ev9_car_battery_level') }}%."

  - id: ev9_climate_auto_shutoff
    alias: EV9 shut off climate if unattended
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.ev9_climate
        to: "on"
        for: "00:25:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.ev9_front_left_door
        state: "off"
    actions:
      - action: switch.turn_off
        target: {entity_id: switch.ev9_climate}
      - action: script.ev9_notify
        data:
          title: "EV9 Climate Guard"
          message: "HVAC auto-stopped after 25 minutes of unattended runtime."

  # ----------------------------------------------------------- Departure planner
  - id: ev9_departure_climate
    alias: EV9 departure initiate climate
    triggers:
      - trigger: template
        value_template: >
          {% set t = today_at(states('input_datetime.ev9_ready_by')) - timedelta(minutes=states('input_number.ev9_departure_lead')|float(15)) %}
          {{ now().strftime('%H:%M') == t.strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: input_boolean.ev9_departure_enabled
        state: "on"
      - condition: template
        value_template: "{{ is_state('input_boolean.ev9_departure_weekdays', 'off') or now().weekday() < 5 }}"
      - condition: state
        entity_id: device_tracker.ev9_location
        state: home
    actions:
      - action: climate.set_temperature
        target: {entity_id: climate.ev9_climate_control}
        data: {temperature: "{{ states('input_number.ev9_departure_temp')|float(70) }}"}
      - action: switch.turn_on
        target: {entity_id: switch.ev9_climate}
      - action: script.ev9_notify
        data:
          title: "EV9 Preconditioning"
          message: "Cabin preconditioning started for {{ states('input_datetime.ev9_ready_by')[:5] }} departure."

  - id: ev9_departure_charge
    alias: EV9 departure initiate charging
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.ev9_departure_enabled
        state: "on"
      - condition: template
        value_template: "{{ is_state('input_boolean.ev9_departure_weekdays', 'off') or now().weekday() < 5 }}"
      - condition: state
        entity_id: binary_sensor.ev9_ev_battery_plug
        state: "on"
      - condition: state
        entity_id: binary_sensor.ev9_ev_battery_charge
        state: "off"
      - condition: state
        entity_id: device_tracker.ev9_location
        state: home
      - condition: template
        value_template: >
          {% set limit = [states('number.ev9_ac_charging_limit')|float(100), states('number.ev9_dc_charging_limit')|float(100)]|min %}
          {% set soc = states('sensor.ev9_ev_battery_level')|float(0) %}
          {% set need_min = ([limit - soc, 0]|max) / 100 * states('input_number.ev9_battery_kwh')|float(99.8) / states('input_number.ev9_home_charge_kw')|float(9.6) * 60 %}
          {% set est = states('sensor.ev9_estimated_charge_duration')|float(0) %}
          {% set minutes = [need_min, est]|max + states('input_number.ev9_departure_buffer')|float(15) %}
          {% set ready = today_at(states('input_datetime.ev9_ready_by')) %}
          {{ soc < limit - 1 and ready - timedelta(minutes=minutes) <= now() < ready }}
      - condition: template
        value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}"
    actions:
      - action: switch.turn_on
        target: {entity_id: switch.ev9_ev_charging}
      - action: script.ev9_notify
        data:
          title: "EV9 Departure Charge"
          message: "Initiated charge to achieve target before {{ states('input_datetime.ev9_ready_by')[:5] }}."
